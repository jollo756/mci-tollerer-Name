<!DOCTYPE html>
<head>
    <title>Bewertung abgeben</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .main-container {
            all:unset;
            margin-top: 90px;
            background: none;
            align-items: right;
        }

    </style>
</head>
<header class="top-bar">
  <a href="Student_Dashboard.html" class="nav-btn"> Home</a>
   <div class="path-display underline">Home / Bewertung abgeben</div>
  <a href="login.html" class="nav-btn logout">Logout</a>
</header>
<body>
    <div class="main-container">
        <div class="back-btn" onclick="history.back()">
            <a> &larr;</a>
        </div>
        <div class="card">
            <p class="label">Geschwindigkeit:</p>
            <div class="button-group" data-name="speed">
                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>
                <button type="button">4</button>
                <button type="button">5</button>
            </div>
        </div>

        <div class="card">
            <p class="label">Schwierigkeit:</p>
            <div class="button-group" data-name="difficulty">
                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>
                <button type="button">4</button>
                <button type="button">5</button>
            </div>
        </div>

        <div class="card">
            <p class="label">Allgemeines Feedback:</p>
            <textarea 
                id="feedback"
                placeholder="Write your feedback here...(optional)"
                rows="5"></textarea>
        </div>

        
    </div>
    <button id="submitBtn">Submit</button>
    <!-- Popup -->
        <div class="modal" id="courseModal">
            <div class="modal-content" >
                <div class="modal-container" id="modal-inner">
                    <h3>Bewertung abgegeben!</h3>
                    <div class ="check-icon"> <a>&#10003;</a></div>
            </div>
        </div>
<script src="script.js"></script>
</body>
</html>
