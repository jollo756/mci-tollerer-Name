<!DOCTYPE html>
<head>
    <title>Frage stellen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cancel-btn:hover {
            background-color: #8b8888;
        }
        </style>
</head>


    <body>
        <header class="top-bar">
            <a href="Student_Dashboard.html" class="nav-btn"> Home</a>
            <div class="path-display underline">Home / Frage stellen</div>
            <a href="login.html" class="nav-btn logout">Logout</a>
        </header>
          <div class="main-container">
            <div class="back-btn"  onclick="history.back()">
            <a> &larr;</a>
            </div>
            <h1 class="title">Stelle deine Frage:</h1>

            <form onsubmit="sub_question(); return false;">
                <textarea 
                    id="textfrage" 
                    name="question" 
                    rows="5" 
                    cols="50"
                    placeholder="Frage hier eingeben..."
                    required></textarea>
                <br><br>
                <div id="down">
                    <button type="submit" id="submit" >Submit</button>
                </div>
            </form>
        </div>
        <!-- Popup -->
        <div class="modal" id="courseModal">
            <div class="modal-content" >
                <div class="modal-container" id="modal-inner">
                    <h3>Frage eingereicht!</h3>
                    <div class ="check-icon"> <a>&#10003;</a></div>
            </div>
        </div>
    </body>
    <script>
        var stop = false;
        const pop= document.getElementById("modal-inner");
        function openModal(done) {
            document.getElementById("courseModal").style.display = "flex";
            setTimeout(() => {
                if(done){
                    location.href = "Student_Dashboard.html";
                } else {
                    closeModal();
                }
            }, 800);
        }
        function closeModal() {
            document.getElementById("courseModal").style.display = "none";
        }
        function cancel() {
            stop = true;
            const lower = document.getElementById("down");
            lower.innerHTML = '<button type="submit" id="submit" >Submit</button>';
            pop.innerHTML = `<h3>Frage senden abgebrochen.</h3>
            <div class ="X-icon"> <a>&#10005;</a></div>`;
            openModal(false);
        }
        function sub_question() {
            stop = false;
            const lower = document.getElementById("down");
            lower.innerHTML = '<button class="cancel-btn" id="cancel-btn" onclick="cancel()">cancel 3s</button>';
            const btn = document.getElementById("cancel-btn");
            count=25;
            btn.innerHTML = "cancel " + Math.ceil(count/10) + "s";
            const interval = setInterval(() => {
                count--;
                if(stop){
                    clearInterval(interval); 
                    
                }
                if (count > 1 ) {
                    
                    btn.innerHTML = "cancel " + Math.ceil(count/10) + "s";
                } if (count < 0) {
                    clearInterval(interval);
                    pop.innerHTML = `<h3>Frage eingereicht!</h3>
                    <div class ="check-icon"> <a>&#10003;</a></div>`;
                    openModal(true);
                }
            }, 100); 
            
        }

    </script>
</html>
