<!DOCTYPE html>
<head>
    <title>Frage stellen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cancel-btn:hover {
            background-color: #8b8888;
        }
        </style>
</head>
<header class="top-bar">
  <a href="Student_Dashboard.html" class="nav-btn"> Home</a>
  <a href="login.html" class="nav-btn logout">Logout</a>
</header>

    <body>
          <div class="main-container">
            <div class="back-btn"  onclick="history.back()">
            <a> &larr;</a>
            </div>
            <h1 class="title">Stelle deine Frage:</h1>

            <form onsubmit="sub_question(); return false;">
                <textarea 
                    id="textfrage" 
                    name="question" 
                    rows="5" 
                    cols="50"
                    placeholder="Frage hier eingeben..."
                    required></textarea>
                <br><br>
                <div id="down">
                    <button type="submit" id="submit" >Submit</button>
                </div>
            </form>
        </div>
    </body>
    <script>
        function openModal() {}
        function closeModal() {}
        function cancel() {
            alert("Abgebrochen");
            window.location.reload();
        }
        function sub_question() {
            var frage = document.getElementById("textfrage").value;
            if (frage!=0) {
                const lower = document.getElementById("down");
                lower.innerHTML = '<button class="cancel-btn" id="cancel-btn" onclick="cancel()">cancel 3s</button>';
                setTimeout(() => {
                    const btn = document.getElementById("cancel-btn");
                    btn.innerText = "cancel 2s";
                    setTimeout(() => {
                        btn.innerText = "cancel 1s";
                        setTimeout(() => {
                            window.location.href = "Student_Dashboard.html";
                        }, 1000);
                    }, 1000);
                    
                    
                }, 1000);
                
         
                
                
            }
            else {
                alert("Bitte geben Sie eine Frage ein.");
            }
        }
    </script>
</html>
